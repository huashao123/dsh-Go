name: Build DSH-Go APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'APK 架构（大多数安卓手机选 arm64 即可）'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - universal

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 1. 释放云端构建机磁盘空间（防止编译运行时爆盘）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - name: 2. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 3. 配置官方工具链（JDK 17 / Flutter / Android SDK & NDK）
        run: |
          bash tooling/setup-toolchain.sh

      - name: 4. 构建内置 Linux 运行时
        run: |
          if [ "${{ inputs.flavor }}" = "universal" ]; then
            bash runtime/build-runtime.sh arm64-v8a
            bash runtime/build-runtime.sh armeabi-v7a
          else
            bash runtime/build-runtime.sh arm64-v8a
          fi

      - name: 5. 编译打包 APK
        env:
          DSH_BETA_TOKEN_FILE: ""
        run: |
          bash tooling/build-apk.sh -f "${{ inputs.flavor }}"

      - name: 6. 收集生成的 APK 文件
        run: |
          mkdir -p release-apks
          find . -type f -name "*.apk" \
            ! -path "*/intermediates/*" \
            ! -path "*/.git/*" \
            -exec cp -v {} release-apks/ \;
          ls -lh release-apks/

      - name: 7. 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-claude-${{ inputs.flavor }}-apk
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14
